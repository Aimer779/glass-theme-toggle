<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>玻璃 · 昼夜开关</title>
  <link rel="stylesheet" href="styles.css">
  <script src="dynamics.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="gesture.js" defer></script>
  <script src="particles.js" defer></script>
  <script src="lighting.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="curve-panel.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="workspace" id="workspace">
    <section class="stage relative overflow-clip" aria-label="开关预览">
      <header class="stage-header absolute z-2"><span>玻璃 / 昼夜</span><button class="text-button" id="panel-toggle" aria-expanded="true" aria-controls="panel">隐藏参数</button></header>
      <div class="ambient absolute decorative" aria-hidden="true"></div>
      <div class="switch-frame relative">
        <button id="theme-switch" class="theme-switch relative" type="button" role="switch" aria-checked="true" aria-label="夜间模式">
          <span class="track absolute decorative" aria-hidden="true"></span>
          <span class="thumb absolute decorative" aria-hidden="true">
            <span class="glass absolute"></span>
            <span class="glass-reflection absolute"></span>
            <canvas class="lighting absolute" aria-hidden="true"></canvas>
            <canvas class="particles absolute" aria-hidden="true"></canvas>
          </span>
        </button>
      </div>
      <footer class="stage-footer absolute"><span id="theme-label">夜间</span><span>拖动或点击 · 空格切换</span></footer>
    </section>
    <aside class="panel overflow-y-auto" id="panel" aria-label="效果参数">
      <header class="panel-header"><h1>效果参数</h1><p>实时调整，自动保存在此浏览器。</p></header>
      <section class="curve-panel" aria-label="动画曲线">
        <div class="curve-heading"><h2>实际响应曲线</h2><select id="curve-channel" aria-label="曲线类型"><option value="x">滑块位移</option><option value="sx">横向形变</option><option value="sy">纵向形变</option><option value="phase">高光相位</option><option value="morph">图案过渡</option></select></div>
        <svg id="curve-chart" viewBox="0 0 260 182" role="img" aria-labelledby="curve-title curve-description">
          <title id="curve-title">实际响应曲线</title><desc id="curve-description">横轴为记录时间，纵轴为实际值，包含超调。时间游标可以定格和重播最近一次交互。</desc>
          <path class="chart-grid" d="M32 20H244 M32 84H244 M138 20V148"/>
          <path class="chart-axis" d="M32 16V148H248"/>
          <text id="chart-ymax" x="1" y="24">1.1</text><text id="chart-ymin" x="1" y="152">−0.1</text><text x="215" y="175">时间</text>
          <path id="curve-line" class="chart-line"/>
          <path id="curve-guide" class="chart-guide"/>
          <circle id="curve-dot" class="chart-dot" r="4.5"/>
        </svg>
        <p id="curve-formula" class="curve-formula"></p>
        <div id="curve-tuning"></div>
        <label class="parameter"><span>时间游标</span><output id="timeline-output" for="timeline">100%</output><input id="timeline" type="range" min="0" max="1000" step="1" value="1000"></label>
        <div class="curve-readout"><span id="curve-direction">日间 → 夜间</span><span id="curve-value">完成 100%</span></div>
        <div class="curve-actions"><button class="action-button" id="replay" type="button">重播</button><button class="action-button" id="resume" type="button" disabled>继续播放</button></div>
        <p id="curve-status" class="curve-status" role="status">拖动开关以记录响应，再用游标定格。</p>
      </section>
      <form id="parameters"></form>
      <div class="panel-actions"><button class="action-button" id="reset" type="button">恢复默认</button><button class="action-button" id="export" type="button">导出参数</button></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </aside>
  </main>
</body>
</html>
